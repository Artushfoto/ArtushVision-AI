# --- default.html ---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Primární signály pro Google Site Names -->
    <meta name="application-name" content="ArtushVision AI">
    <meta name="apple-mobile-web-app-title" content="ArtushVision AI">
    <meta property="og:site_name" content="ArtushVision AI">

    <!-- Schema.org WebSite pro Google Site Names (pouze pro hlavní stránku) -->
    {% if page.url == "/" or page.url == "/index.html" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ArtushVision AI",
      "alternateName": "ArtushVision",
      "url": "https://vision.artushfoto.eu/"
    }
    </script>
    {% endif %}

    <!-- Jekyll SEO tag vygeneruje správný titulek a meta tagy pro každou stránku zvlášť -->
    {% seo %}

    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KCZWMGZFJ5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KCZWMGZFJ5');
    </script>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}
    </div>
  </body>
</html>
# --- default.html ---
