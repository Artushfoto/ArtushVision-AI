<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="application-name" content="ArtushVision AI">
    <meta name="apple-mobile-web-app-title" content="ArtushVision AI">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://vision.artushfoto.eu/#website",
      "name": "ArtushVision AI",
      "url": "https://vision.artushfoto.eu/",
      "inLanguage": "en-US",
      "publisher": {
        "@type": "Organization",
        "name": "ArtushVision AI",
        "url": "https://vision.artushfoto.eu/"
      }
    }
    </script>

    {% seo title=false %}
    <title>{{ page.title | default: site.title }} | ArtushVision AI</title>

    <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

    {% if site.google_analytics %}
      <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}');
      </script>
    {% endif %}
  </head>

  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}
    </div>
  </body>
</html>
