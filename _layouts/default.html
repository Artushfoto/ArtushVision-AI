# --- default.html ---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Doplňkové signály pro mobilní a desktopové zobrazení -->
    <meta name="application-name" content="ArtushVision AI">
    <meta name="apple-mobile-web-app-title" content="ArtushVision AI">

    <!-- Jekyll SEO tag vygeneruje JEDINÉ čisté schema WebSite a og:site_name přímo z _config.yml -->
    {% seo %}

    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KCZWMGZFJ5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KCZWMGZFJ5');
    </script>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}
    </div>
  </body>
</html>
# --- default.html ---
